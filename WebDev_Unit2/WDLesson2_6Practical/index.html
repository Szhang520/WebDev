    <link href="style.css" rel="stylesheet" type="text/css" />
    <script src="script.js"></script>
    <style>
      /* Challenge 6: Using internal styling,  change the color of the web page.*/
      body{
        background-color: rgb(185, 211, 199);
      }
      /* Further challenges 7-11 are located in style.css  */

      /* Challenge 12: Create the other pages in the sitemap using index.html as the template. 
                       Modify the heading in the banner container appropriately to match the topic of the web page.
                       Modify the image included to match the topic of the web page.

      */
      
    </style>
  </head>
  <body>
    <!-- Challenge 1: Create the navigation bar in support of the sitemap associated with the website. -->
    <nav>
      <a href="index.html">Homepage</a>
      <a href="html.html">HTML</a>
      <a href="css.html">CSS</a>
      <a href="js.html">JS</a>
    </nav>
    <!-- Challenge 2: Create a banner container with heading of "Web Development".  Give it a class of "banner".-->
     <div class="banner">
      <h1>Web Development</h1>
     </div>

    <div class="main">
      <!-- Challenge 3: Add the image of webicons.png-->
      <img src="webicons.png" style="height:300px;"> </img>
      <!-- Challenge 4: Using inline styling, resize the above image appropriately -->
      <!-- Challenge 5: Write a paragraph describing web development.  Discuss the purpose of HTML, CSS and JavaScript -->
       <p>The purpose of web development is to create or development a website. The purpose of HTML is used to structure the content, CSS is used to style the content, and JavaScript is used to add interactivity and functionality to the web page. </p>
    </div>
